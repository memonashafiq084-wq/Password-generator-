<nav>
<div><strong>Memona Ishaq</strong></div>
<div>

<div class="container">
<div class="card">

<h1>Password Generator</h1>

<div class="password" id="password">Click Generate</div>

<label>Length: <span id="lengthValue">12</span></label>
<input type="range" min="6" max="32" value="12" id="length" style="width:100%;">

<br><br>

<label><input type="checkbox" id="letters" checked> Letters</label><br>
<label><input type="checkbox" id="numbers" checked> Numbers</label><br>
<label><input type="checkbox" id="symbols"> Symbols</label>

<button class="generate" onclick="generatePassword()">Generate</button>
<button class="copy" onclick="copyPassword()">Copy</button>

</div>
</div>

<div class="footer">
© 2026 Memona Ishaq | Premium Tool
</div>

<script>

const lengthSlider=document.getElementById("length");
const lengthValue=document.getElementById("lengthValue");
const passwordBox=document.getElementById("password");

lengthSlider.oninput=function(){
lengthValue.textContent=this.value;
}

function generatePassword(){
const length=lengthSlider.value;
const letters="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
const numbers="0123456789";
const symbols="@#$%&*!";

let chars="";
if(document.getElementById("letters").checked) chars+=letters;
if(document.getElementById("numbers").checked) chars+=numbers;
if(document.getElementById("symbols").checked) chars+=symbols;

if(chars===""){
passwordBox.textContent="Select option!";
return;
}

let password="";
for(let i=0;i<length;i++){
password+=chars.charAt(Math.floor(Math.random()*chars.length));
}

passwordBox.textContent=password;
}

function copyPassword(){
navigator.clipboard.writeText(passwordBox.textContent);
alert("Copied!");
}

</script>
